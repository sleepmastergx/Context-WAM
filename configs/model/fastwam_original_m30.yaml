# Original lock-step Fast-WAM: 30-layer video expert + 30-layer action expert.
#
# Unlike the repository's Context-WAM 30/5 decoupled configs, this uses the
# published equal-depth MoT path (`create_fastwam`) with no fused-KV routing and
# no TTT memory. The pretrained Wan2.2 video DiT is loaded; the action expert is
# randomly initialized because no action checkpoint is supplied.
_target_: fastwam.runtime.create_fastwam
model_id: Wan-AI/Wan2.2-TI2V-5B
tokenizer_model_id: Wan-AI/Wan2.1-T2V-1.3B
tokenizer_max_len: 128
load_text_encoder: false
proprio_dim: 8
redirect_common_files: true
mot_checkpoint_mixed_attn: true

action_dit_pretrained_path: null
skip_dit_load_from_pretrain: false
freeze_video_backbone: false

video_dit_config:
  has_image_input: false
  patch_size: [1, 2, 2]
  in_dim: 48
  hidden_dim: 3072
  ffn_dim: 14336
  freq_dim: 256
  text_dim: 4096
  out_dim: 48
  num_heads: 24
  attn_head_dim: 128
  num_layers: 30
  eps: 1.0e-06
  seperated_timestep: true
  require_clip_embedding: false
  require_vae_embedding: false
  fuse_vae_embedding_in_latents: true
  use_gradient_checkpointing: true
  video_attention_mask_mode: "first_frame_causal"
  action_conditioned: false
  action_dim: 8
  action_group_causal_mask_mode: "group_diagonal"

action_dit_config:
  action_dim: 8
  hidden_dim: 1024
  ffn_dim: 4096
  num_heads: 24
  attn_head_dim: 128
  num_layers: 30
  text_dim: 4096
  freq_dim: 256
  eps: 1.0e-06
  use_gradient_checkpointing: true
  action_text_cross_attn: true

video_scheduler:
  train_shift: 5.0
  infer_shift: 5.0
  num_train_timesteps: 1000

action_scheduler:
  train_shift: 5.0
  infer_shift: 5.0
  num_train_timesteps: 1000

loss:
  lambda_video: 1.0
  lambda_action: 1.0

memory:
  enabled: false
